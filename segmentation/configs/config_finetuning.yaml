# Fine tuning configuration : head of prosodic segmentation  
# Frozen encoders: ["Pantagruel-B-1K","Pantagruel-B-14K","Pantagruel-L-14K","LeBenchmark-w2v-B-1k","LeBenchmark-w2v-L-7k"]

encoder:
  name: ["Pantagruel-B-1K","Pantagruel-B-14K","Pantagruel-L-14K","LeBenchmark-w2v-B-1k","LeBenchmark-w2v-L-7k"]
  model_id: ["PantagrueLLM/speech-base-1K","PantagrueLLM/speech-base-14K","PantagrueLLM/speech-large-14K","LeBenchmark/wav2vec2-FR-1K-base","LeBenchmark/wav2vec2-FR-7K-large"]
  freeze: true
  hidden_dim: 768
  hidden_dim_large: 1024
data:
  common_voice_root: "data/raw/cv-corpus-25.0-2026-03-09/fr"
  split_train: "train"
  split_valid: "dev"
  split_test: "test"
  max_samples_train: 10000
  max_samples_valid: 5000
  cache_dir: "data/cache"
  sample_rate: 16000

labels:
  min_pause_duration: 0.25
  gaussian_sigma_frames: 1.5
  include_utterance_end: true

model:
  conv_channels: 256
  lstm_hidden: 256
  lstm_layers: 2
  dropout: 0.2

training:
  batch_size: 8
  num_epochs: 30
  learning_rate: 0.0003
  weight_decay: 0.00001
  loss: "bce_with_logits"  # "bce_with_logits" or "mse"
  pos_weight: 1.0
  early_stopping_patience: 5
  grad_clip_norm: 1.0
  num_workers: 2
  device: "cuda"  # "cuda" or  "cpu"
  seed: 42

evaluation:
  tolerance_sec: 0.25
  peak_prominence: 0.1
  peak_min_distance_sec: 0.2

paths:
  checkpoints_dir: "checkpoints"
  logs_dir: "logs"
  best_model_name: "best_segmentation_head"
